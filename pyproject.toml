[project]
name = "gaa-fixtures-api"
version = "2.0.3"
description = "REST API and iCal feed for GAA fixtures"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "pydantic>=2.14.3",
    "icalendar>=7.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "httpx2>=2.16.0",
    "black>=26.10.1",
    "ruff>=0.17.4",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "ARG", "SIM"]
ignore = ["E501", "E203"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
