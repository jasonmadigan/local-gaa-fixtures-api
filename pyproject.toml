[project]
name = "gaa-fixtures-api"
version = "2.0.2"
description = "REST API and iCal feed for GAA fixtures"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "requests==2.33.0",
    "beautifulsoup4==4.12.2",
    "pydantic==2.5.0",
    "icalendar==6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27,<0.28",
    "black>=24.0",
    "ruff>=0.6",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "ARG", "SIM"]
ignore = ["E501", "E203"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
# starlette 0.27's TestClient still uses the httpx app shortcut
filterwarnings = ["ignore:The 'app' shortcut is now deprecated:DeprecationWarning"]
